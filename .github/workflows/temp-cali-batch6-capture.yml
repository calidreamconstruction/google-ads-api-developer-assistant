name: Temporary Cali Batch 6 Browser Capture

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Capture actual desktop and mobile pages
        run: node capture_cali_batch6.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cali-batch6-actual-desktop-mobile
          path: cali-batch6-actual
          if-no-files-found: error
          retention-days: 3
