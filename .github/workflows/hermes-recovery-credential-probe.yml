name: Hermes Recovery Credential Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/hermes-recovery-credential-probe.yml"
      - "hermes-recovery-credential-probe.trigger"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
      PC_EXECUTOR_TOKEN: ${{ secrets.PC_EXECUTOR_TOKEN }}
      AZANI_API_TOKEN: ${{ secrets.AZANI_API_TOKEN }}
    steps:
      - name: Report secret availability without values
        shell: bash
        run: |
          set -Eeuo pipefail
          names=(
            VPS_SSH_PRIVATE_KEY VPS_SSH_KEY SSH_PRIVATE_KEY SSH_KEY
            DEPLOY_SSH_KEY DEPLOY_KEY HETZNER_SSH_KEY VPS_PASSWORD ROOT_PASSWORD
            VPS_HOST VPS_USER TAILSCALE_AUTHKEY TS_AUTHKEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET
            CLOUDFLARE_API_TOKEN CLOUDFLARE_API_KEY CF_API_TOKEN CLOUDFLARE_TUNNEL_TOKEN
            OPENCLAW_GATEWAY_TOKEN PC_EXECUTOR_TOKEN AZANI_API_TOKEN
          )
          printf '{"schema":"faressystem.hermes_recovery_credential_probe/v1","secrets":{'
          first=1
          for name in "${names[@]}"; do
            [ "$first" -eq 1 ] || printf ','
            first=0
            if [ -n "${!name:-}" ]; then present=true; else present=false; fi
            printf '"%s":%s' "$name" "$present"
          done
          printf '},"secrets_emitted":false}\n'
          timeout 6 bash -c '</dev/tcp/5.78.79.135/22' \
            && echo 'vps_tcp_22=reachable' || echo 'vps_tcp_22=unreachable'
