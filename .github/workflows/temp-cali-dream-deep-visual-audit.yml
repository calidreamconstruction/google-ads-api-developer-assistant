name: Temporary Cali Dream Deep Visual Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install browser and parser dependencies
        run: |
          mkdir -p /tmp/calidream-deep-audit
          cd /tmp/calidream-deep-audit
          npm init -y
          npm install playwright@1.54.1 cheerio@1.0.0
          npx playwright install --with-deps chromium

      - name: Discover, inspect and capture never-screenshoted pages
        run: |
          cd /tmp/calidream-deep-audit
          cat > audit.js <<'EOF'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');
          const path = require('path');
          const ROOT = 'https://blog.calidreamconstruction.com';
          const OUT = path.join(process.cwd(), 'calidream-deep-visual-audit');
          fs.mkdirSync(path.join(OUT, 'screenshots'), { recursive: true });
          const PRIOR = [
            'https://blog.calidreamconstruction.com/','https://blog.calidreamconstruction.com/blog/','https://blog.calidreamconstruction.com/areas/','https://blog.calidreamconstruction.com/guides/','https://blog.calidreamconstruction.com/projects/',
            'https://blog.calidreamconstruction.com/blog/kitchen-remodel-cost-guide-san-diego','https://blog.calidreamconstruction.com/blog/home-addition-contractor-san-diego','https://blog.calidreamconstruction.com/blog/adu-permits-san-diego-complete-guide','https://blog.calidreamconstruction.com/blog/kitchen-remodel-cost-encinitas','https://blog.calidreamconstruction.com/compare/adu-vs-garage-conversion','https://blog.calidreamconstruction.com/projects/custom-home-build-in-encinitas','https://blog.calidreamconstruction.com/blog/adu-builder-4s-ranch','https://blog.calidreamconstruction.com/blog/bathroom-remodel-cost-4s-ranch-2026','https://blog.calidreamconstruction.com/blog/best-contractor-4s-ranch','https://blog.calidreamconstruction.com/blog/luxury-home-renovation-4s-ranch','https://blog.calidreamconstruction.com/blog/outdoor-living-4s-ranch-design','https://blog.calidreamconstruction.com/blog/remodeling-companies-near-carlsbad','https://blog.calidreamconstruction.com/blog/aging-in-place-remodeling-coronado-universal-design-upgrades-high-end','https://blog.calidreamconstruction.com/blog/full-home-renovation-coronado-planning-phasing','https://blog.calidreamconstruction.com/blog/design-build-process-saves-time-coronado-concept-permit-punch-list'
          ];
          const cities=['san-diego','coronado','oceanside','carlsbad','encinitas','la-jolla','poway','rancho-santa-fe','4s-ranch','escondido','solana-beach','cardiff','bonsall','del-mar','san-marcos','vista','fallbrook','rancho-bernardo','carmel-valley','point-loma','pacific-beach','chula-vista','santee','la-mesa','el-cajon'];
          const services=['kitchen','bathroom','adu','garage-conversion','home-addition','addition','whole-home','full-home','custom-home','new-home','deck','patio','pergola','outdoor','backyard','hardscape','roof','remodel','permit','cost','timeline','project','case-study','accessibility','aging-in-place','flooring','tile'];
          const norm=raw=>{try{const u=new URL(raw,ROOT);if(u.hostname!=='blog.calidreamconstruction.com')return null;u.protocol='https:';u.hash='';for(const k of [...u.searchParams.keys()])if(/^(utm_|gclid|fbclid)/i.test(k))u.searchParams.delete(k);let p=u.pathname.replace(/\/{2,}/g,'/');if(p.length>1)p=p.replace(/\/$/,'');u.pathname=p||'/';return u.toString();}catch{return null;}};
          const locs=x=>[...x.matchAll(/<loc>\s*([^<]+?)\s*<\/loc>/gi)].map(m=>m[1].replace(/&amp;/g,'&').trim());
          async function get(url,ms=25000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{redirect:'follow',signal:c.signal,headers:{'user-agent':'Mozilla/5.0 CaliDreamDeepAudit/1.0'}});return{ok:r.ok,status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type')||'',body:await r.text()};}catch(e){return{ok:false,status:null,finalUrl:url,contentType:'',body:'',error:String(e)}}finally{clearTimeout(t)}}
          async function discover(){const q=[`${ROOT}/sitemap.xml`,`${ROOT}/sitemap_index.xml`,`${ROOT}/sitemap-index.xml`,`${ROOT}/post-sitemap.xml`,`${ROOT}/page-sitemap.xml`],seen=new Set(),urls=new Set(PRIOR.map(norm).filter(Boolean));while(q.length&&seen.size<80){const sm=q.shift();if(seen.has(sm))continue;seen.add(sm);const r=await get(sm);if(!r.ok||!r.body.includes('<loc>'))continue;for(const l of locs(r.body)){if(/\.xml(?:$|\?)/i.test(l))q.push(l);else{const n=norm(l);if(n)urls.add(n)}}}for(const seed of [`${ROOT}/`,`${ROOT}/blog/`,`${ROOT}/areas/`,`${ROOT}/guides/`,`${ROOT}/projects/`]){const r=await get(seed);if(!r.ok)continue;const $=cheerio.load(r.body);$('a[href]').each((_,a)=>{const n=norm($(a).attr('href'));if(n)urls.add(n)})}return{urls:[...urls],sitemaps:[...seen]}}
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          function sig(text){let h=2166136261;const s=text.toLowerCase().replace(/\d{4}/g,'YEAR').replace(/\b\d+(?:\.\d+)?\b/g,'N').slice(0,18000);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
          function inspect(url,r){const x={requestedUrl:url,finalUrl:r.finalUrl,status:r.status,error:r.error||'',path:new URL(url).pathname,title:'',metaDescription:'',h1:'',h1Count:0,canonical:'',robots:'',wordCount:0,headings:[],textExcerpt:'',flags:[],contentSignature:'',internalLinks:0,imageCount:0,missingAltCount:0};if(!r.body||!/html/i.test(r.contentType))return x;const $=cheerio.load(r.body);$('script,style,noscript,svg').remove();x.title=clean($('title').first().text());x.metaDescription=clean($('meta[name="description"]').attr('content'));x.canonical=clean($('link[rel="canonical"]').attr('href'));x.robots=clean($('meta[name="robots"]').attr('content'));const hs=$('h1').map((_,e)=>clean($(e).text())).get().filter(Boolean);x.h1=hs[0]||'';x.h1Count=hs.length;x.headings=$('h1,h2,h3').map((_,e)=>clean($(e).text())).get().filter(Boolean).slice(0,40);const body=clean($('body').text());x.wordCount=body?body.split(/\s+/).length:0;x.textExcerpt=body.slice(0,9000);x.contentSignature=sig(body);x.imageCount=$('img').length;x.missingAltCount=$('img').filter((_,e)=>!clean($(e).attr('alt'))).length;let internal=0;$('a[href]').each((_,a)=>{if(norm($(a).attr('href')))internal++});x.internalLinks=internal;const low=`${x.title} ${x.metaDescription} ${x.h1} ${x.textExcerpt}`.toLowerCase();const tests=[['design-build-language',/design\s*[-–—]?\s*build/],['in-house-design-claim',/our (?:designers|architects)|in-house (?:designer|architect)|team of (?:designers|architects)/],['free-estimate-claim',/free (?:estimate|consultation|quote|assessment)/],['financing-claim',/financing available|flexible financing|payment plans? available|financing options/],['warranty-claim',/\b(?:5|10|15|55|lifetime|five|ten|fifteen)[- ]?year[^.]{0,90}warrant|warrant[^.]{0,90}\b(?:5|10|15|55)[- ]?year/],['rating-review-claim',/\b5\.0\b[^.]{0,60}(?:review|star)|\b(?:42|50\+)\s+(?:verified\s+)?reviews|five[- ]star|top[- ]rated/],['best-contractor-claim',/best contractor|best remodeling company|#1 contractor|number one contractor/],['fixed-price-claim',/\$\s?\d{1,3}(?:,\d{3})+(?:\s?[-–]\s?\$?\d{1,3}(?:,\d{3})+)?|from \$\d/],['fixed-timeline-claim',/\b\d+\s?[-–]\s?\d+\s+(?:weeks|months)|completed in \d+|takes? about \d+|within \d+ (?:hours|days|weeks)/],['permit-guarantee-claim',/we handle all permits|guarantee(?:d)? permit|ensure approval|city approvals for a smooth|permits handled/],['public-address-claim',/2802 paseo del sol/],['placeholder-residue',/write your caption here|slide title|lorem ipsum|\bbutton\b/],['rental-income-roi-claim',/rental income|return on investment|\broi\b|cash flow/],['stale-year',/\b20(?:2[0-5]|1\d)\b/]];for(const[n,re]of tests)if(re.test(low))x.flags.push(n);if(!x.title)x.flags.push('missing-title');if(!x.metaDescription)x.flags.push('missing-meta-description');if(!x.h1)x.flags.push('missing-h1');if(x.h1Count>1)x.flags.push('multiple-h1');if(!x.canonical)x.flags.push('missing-canonical');if(x.wordCount<350&&r.status===200)x.flags.push('thin-page');if(x.missingAltCount>0)x.flags.push('missing-image-alt');return x}
          async function pool(items,n,fn){const out=new Array(items.length);let next=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(true){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i)}}));return out}
          const priorSet=new Set(PRIOR.map(norm));
          function score(x){const s=`${x.path} ${x.title} ${x.h1}`.toLowerCase();let n=0;for(const k of cities)if(s.includes(k))n+=7;for(const k of services)if(s.includes(k))n+=9;if(x.flags.length)n+=Math.min(30,x.flags.length*4);if(/\/projects?\//.test(x.path))n+=18;if(/\/areas?\//.test(x.path))n+=8;if(/\/guides?\//.test(x.path))n+=8;if(/cost|permit|timeline|best-|near-|vs-|compare/.test(s))n+=10;if(priorSet.has(norm(x.requestedUrl)))n+=1000;return n}
          function choose(inv){const map=new Map(inv.map(x=>[norm(x.requestedUrl),x])),chosen=[];for(const u of PRIOR){const x=map.get(norm(u));if(x&&x.status===200&&!x.error)chosen.push({...x,coverageReason:'prior-text-audit-first-actual-screenshot'})}const used=new Set(chosen.map(x=>norm(x.requestedUrl))),cands=inv.filter(x=>x.status===200&&!x.error&&!used.has(norm(x.requestedUrl))&&!String(x.robots).toLowerCase().includes('noindex')).sort((a,b)=>score(b)-score(a)||a.path.localeCompare(b.path));const cc=new Map(),sc=new Map(),dc=new Map();for(const x of cands){if(chosen.length>=64)break;const s=x.path.toLowerCase(),city=cities.find(k=>s.includes(k))||'other',service=services.find(k=>s.includes(k))||'other',a=cc.get(city)||0,b=sc.get(service)||0,d=dc.get(x.contentSignature)||0;if(city!=='other'&&a>=5)continue;if(service!=='other'&&b>=8)continue;if(d>=2)continue;cc.set(city,a+1);sc.set(service,b+1);dc.set(x.contentSignature,d+1);chosen.push({...x,coverageReason:'new-visual-audit'})}return chosen}
          const slug=url=>(new URL(url).pathname.replace(/^\/+|\/+$/g,'')||'home').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,105);
          async function shot(browser,item,device,opts){const c=await browser.newContext({...opts,locale:'en-US',colorScheme:'light',reducedMotion:'reduce',ignoreHTTPSErrors:true}),p=await c.newPage();p.setDefaultTimeout(60000);const errors=[],failed=[];p.on('console',m=>{if(m.type()==='error'&&errors.length<20)errors.push(m.text().slice(0,500))});p.on('requestfailed',r=>{if(failed.length<20)failed.push({url:r.url(),error:r.failure()?.errorText||''})});const s=slug(item.requestedUrl),out={requestedUrl:item.requestedUrl,finalUrl:'',status:null,device,slug:s,error:'',consoleErrors:errors,failedRequests:failed,viewport:opts.viewport};try{const r=await p.goto(item.requestedUrl,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForTimeout(1700);await p.evaluate(async()=>{const max=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);for(let y=0;y<max;y+=900){scrollTo(0,y);await new Promise(r=>setTimeout(r,45))}scrollTo(0,0)});await p.waitForTimeout(850);out.status=r?r.status():null;out.finalUrl=p.url();out.metrics=await p.evaluate(()=>({title:document.title,h1:document.querySelector('h1')?.innerText?.trim()||'',viewportWidth:innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),scrollHeight:Math.max(document.documentElement.scrollHeight,document.body?.scrollHeight||0),reviewWidgetMarkers:document.querySelectorAll('[data-cali-edge-component*="review"], [class*="review"], [id*="review"]').length,formCount:document.querySelectorAll('form,iframe[src*="form"],iframe[src*="leadconnectorhq"]').length}));await p.screenshot({path:path.join(OUT,'screenshots',`${s}__${device}__top.png`),fullPage:false});await p.screenshot({path:path.join(OUT,'screenshots',`${s}__${device}__full.jpg`),fullPage:true,type:'jpeg',quality:50})}catch(e){out.error=String(e&&e.stack?e.stack:e)}await c.close();return out}
          const csv=v=>`"${(Array.isArray(v)?v.join('|'):String(v??'')).replace(/"/g,'""')}"`;
          (async()=>{const d=await discover(),urls=[...new Set(d.urls.map(norm).filter(Boolean))].sort().slice(0,1800),raw=await pool(urls,16,u=>get(u)),inv=urls.map((u,i)=>inspect(u,raw[i])),groups={};for(const x of inv)(groups[x.contentSignature]??=[]).push(x.requestedUrl);for(const x of inv){const g=groups[x.contentSignature]||[];x.duplicateGroupSize=g.length;x.duplicateExamples=g.slice(0,8);if(g.length>=3)x.flags.push('likely-duplicate-template')}const chosen=choose(inv),browser=await chromium.launch({headless:true}),desktop=await pool(chosen,4,x=>shot(browser,x,'desktop',{viewport:{width:1440,height:1000},isMobile:false,hasTouch:false})),mobile=await pool(chosen,4,x=>shot(browser,x,'mobile',{viewport:{width:390,height:844},isMobile:true,hasTouch:true}));await browser.close();const captures=[...desktop,...mobile],summary={discoveredUrls:urls.length,inspectedPages:inv.length,priorTextAuditPagesCaptured:chosen.filter(x=>x.coverageReason==='prior-text-audit-first-actual-screenshot').length,newlySelectedPages:chosen.filter(x=>x.coverageReason==='new-visual-audit').length,uniquePagesCaptured:chosen.length,screenshotFiles:captures.filter(x=>!x.error).length*2,navigationErrors:captures.filter(x=>x.error).length,mobileOverflowPages:mobile.filter(x=>x.metrics&&x.metrics.scrollWidth>x.metrics.viewportWidth+5).length,flagCounts:{}};for(const x of inv)for(const f of x.flags)summary.flagCounts[f]=(summary.flagCounts[f]||0)+1;fs.writeFileSync(path.join(OUT,'inventory.json'),JSON.stringify(inv,null,2));fs.writeFileSync(path.join(OUT,'selected_pages.json'),JSON.stringify(chosen,null,2));fs.writeFileSync(path.join(OUT,'capture_manifest.json'),JSON.stringify(captures,null,2));fs.writeFileSync(path.join(OUT,'coverage_summary.json'),JSON.stringify(summary,null,2));fs.writeFileSync(path.join(OUT,'discovered_sitemaps.json'),JSON.stringify(d.sitemaps,null,2));const hs=['requestedUrl','finalUrl','status','path','title','metaDescription','h1','h1Count','canonical','robots','wordCount','imageCount','missingAltCount','internalLinks','duplicateGroupSize','flags','error'],rows=[hs.map(csv).join(',')];for(const x of inv)rows.push(hs.map(h=>csv(x[h])).join(','));fs.writeFileSync(path.join(OUT,'blog_remaining_inventory.csv'),rows.join('\n'));const ch=['url','coverageReason','title','h1','flags','desktopTop','desktopFull','mobileTop','mobileFull'],cr=[ch.map(csv).join(',')];for(const x of chosen){const s=slug(x.requestedUrl);cr.push([x.requestedUrl,x.coverageReason,x.title,x.h1,x.flags,`screenshots/${s}__desktop__top.png`,`screenshots/${s}__desktop__full.jpg`,`screenshots/${s}__mobile__top.png`,`screenshots/${s}__mobile__full.jpg`].map(csv).join(','))}fs.writeFileSync(path.join(OUT,'actual_screenshot_coverage_manifest.csv'),cr.join('\n'));console.log(JSON.stringify(summary,null,2))})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node --check audit.js
          node audit.js

      - name: Upload actual desktop/mobile screenshots and inventory
        uses: actions/upload-artifact@v4
        with:
          name: calidream-deep-visual-audit-actual
          path: /tmp/calidream-deep-audit/calidream-deep-visual-audit
          if-no-files-found: error
          retention-days: 5
