name: Temporary Cali Blog Remaining Pages Audit Public Runner

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Prepare isolated audit runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cali-blog-audit /tmp/cali-blog-audit-out
          mkdir -p /tmp/cali-blog-audit
          cd /tmp/cali-blog-audit
          npm init -y
          npm install playwright@1.54.1 cheerio@1.0.0
          PLAYWRIGHT_BROWSERS_PATH=/tmp/cali-blog-audit/pw-browsers npx playwright install --with-deps chromium

      - name: Discover inspect and screenshot only unaudited blog pages
